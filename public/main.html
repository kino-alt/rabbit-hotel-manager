<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>担当選択｜うさぎホテル業務管理</title>
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
  <link rel="preconnect" href="https://securetoken.googleapis.com" crossorigin />
  <link rel="dns-prefetch" href="https://www.google.com" />
  <link rel="modulepreload" href="vendor.js" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <button class="ghost small" id="menu-btn" aria-label="メニューを開く"><span class="ico ico-menu"></span></button>
      <h1>ホテル一覧</h1>
      <button class="ghost small" id="logout-btn">ログアウト</button>
    </header>

    <div class="row spread" style="margin-bottom:8px">
      <span class="row" style="gap:0">
        <span class="store-label">店舗：</span>
        <select id="store-select" class="store-select"></select>
      </span>
      <a href="register.html" class="add-btn" aria-label="うさぎ登録" title="うさぎ登録"><span class="ico ico-plus"></span></a>
    </div>
    <div class="date-nav">
      <button class="ghost" id="ov-prev" aria-label="前の週"><span class="ico ico-chevron-left"></span></button>
      <span class="label" id="ov-range"></span>
      <button class="ghost" id="ov-next" aria-label="次の週"><span class="ico ico-chevron-right"></span></button>
    </div>
    <div class="scroll-x">
      <table class="overview compact" id="ov-table"></table>
    </div>
    <p class="muted" style="font-size:12px">
      〇＝未実施　◐＝実施済み　●＝LINE送信済み<br><span class="sw stay">緑</span>＝宿泊中、<span class="sw stay-holiday">濃い緑</span>＝宿泊中の定休日、<span class="sw holiday">赤</span>＝定休日<br />
      編集：うさぎ名をタップ
    </p>
  </div>

  <div id="drawer-overlay"></div>
  <nav id="drawer" class="drawer">
    <div class="drawer-head">
      <b>メニュー</b>
      <button class="ghost small" id="drawer-close" aria-label="メニューを閉じる"><span class="ico ico-close"></span></button>
    </div>
    <a href="care.html">ケア担当</a>
    <a href="run.html">ラン担当</a>
    <a href="history.html">過去の記録</a>
    <a href="admin.html">設定</a>
  </nav>

  <script type="module" src="main.js"></script>
</body>
</html>
